<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#5b1fa8">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg">
    <title>بيانات الطالب</title>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar" id="topbar"></header>

<main class="center-page">
    <section class="card mid center" id="card">
        <div class="loader-dots">جارٍ تحميل البيانات...</div>
    </section>
</main>

<script src="app.js"></script>
<script>
    renderTopbar([], "", { home: "login.html", logout: "تسجيل الخروج", logoutTo: "login.html" });

    const card = $("#card");

    function notFound(text) {
        card.innerHTML = `
            <div class="icon-badge">🔍</div>
            <h2>${text}</h2>
            <p class="sub">تأكد من الرابط أو سجّل الدخول من جديد</p>
            <a class="btn" href="login.html">الذهاب لتسجيل الدخول</a>`;
    }

    /* لازم يكون الطالب مسجل دخوله */
    auth.onAuthStateChanged(user => {
        if (!user) { location.href = "login.html"; return; }

        const id = getParam("id") || user.uid;
        db.ref("students/" + id).once("value").then(snap => {
            if (!snap.exists()) { notFound("الطالب غير موجود في قاعدة البيانات"); return; }
            render(snap.val());
        }).catch(() => notFound("تعذر تحميل البيانات"));
    });

    function render(s) {
        card.innerHTML = `
            <div class="avatar xl">${escapeHtml(initial(s.name))}</div>
            <h2>${escapeHtml(s.name)}</h2>
            <p class="sub" style="margin-bottom:0;direction:ltr">${escapeHtml(s.email)}</p>

            <h3 class="section">رمز الحضور (QR)</h3>
            <p class="sub" style="margin-bottom:10px">أظهر هذا الرمز أمام الكاميرا لتسجيل حضورك</p>
            <div class="qr-box" id="qr"></div>
            <button class="btn ghost sm" id="dl" type="button">⬇ تحميل الرمز</button>

            <div class="rows">
                <div class="row"><span>الاسم</span><b>${escapeHtml(s.name)}</b></div>
                <div class="row"><span>البريد</span><b class="ltr">${escapeHtml(s.email)}</b></div>
                <div class="row"><span>المعرّف</span><b class="ltr">${escapeHtml(s.uid)}</b></div>
            </div>

            <div id="mine"></div>

            <div class="stats" id="stats"></div>

            <h3 class="section" style="text-align:right">سجل الحضور</h3>
            <ul class="history" id="history"><li class="empty-li">جارٍ التحميل...</li></ul>
        `;

        new QRCode($("#qr"), {
            text: s.uid,
            width: 200,
            height: 200,
            colorDark: "#2a0a4d",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
        });

        $("#dl").addEventListener("click", () => {
            const canvas = $("#qr canvas");
            if (!canvas) return;
            const a = document.createElement("a");
            a.href = canvas.toDataURL("image/png");
            a.download = "qr-" + (s.name || "student") + ".png";
            a.click();
        });

        loadHistory(s.uid);
    }

    /* حالة الطالب في كل مقرر: الغيابات والحد وإنذار قبل الحرمان */
    async function showCourses(uid, bySec) {
        const ids = Object.keys(bySec);
        if (!ids.length) return;

        const infos = await Promise.all(ids.map(async sid => {
            try {
                const get = p => db.ref(`sections/${sid}/${p}`).once("value").then(x => x.val());
                const [course, section, limit, ov] = await Promise.all([get("course"), get("section"), get("limit"), get("override/" + uid)]);
                return course ? { sid, label: secLabelOf({ course, section }), limit: limit || 0, override: ov || null } : null;
            } catch (e) { return null; }      /* ما عنده صلاحية قراءة هذه الشعبة: نتجاوزها */
        }));

        const rows = infos.filter(Boolean).map(i => {
            const dep = deprivation(absencesOf(bySec[i.sid]), i.limit, i.override);
            const tone = dep.deprived ? "bad" : dep.warn ? "warn" : "ok";
            const msg = dep.deprived ? "⛔ أنت محروم من هذا المقرر. راجع معلمك"
                : dep.warn ? warnMsg(dep.left)
                : i.limit ? "✓ وضعك سليم · الحرمان عند: " + i.limit + " غيابات"
                : "لم يُحدد حد للحرمان";
            const pct = i.limit ? Math.min(100, Math.round(dep.absences / i.limit * 100)) : 0;
            return `<div style="border:1px solid ${tone === "ok" ? "var(--line)" : "var(--" + tone + ")"};border-radius:14px;padding:12px 14px;margin-bottom:10px;text-align:right">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
                    <b>${escapeHtml(i.label)}</b>
                    <span>الغيابات: <b dir="ltr">${dep.absences}${i.limit ? " / " + i.limit : ""}</b></span>
                </div>
                ${i.limit ? `<div class="pct"><div class="track"><div class="fill ${tone === "ok" ? "" : tone}" style="width:${pct}%"></div></div></div>` : ""}
                <div class="badge ${tone}" style="white-space:normal">${msg}</div>
            </div>`;
        });

        if (rows.length) $("#mine").innerHTML = `<h3 class="section" style="text-align:right">حالتي في المقررات</h3>` + rows.join("");
    }

    function loadHistory(uid) {
        db.ref("attendance/" + uid).once("value").then(snap => {
            const items = [];
            const bySec = {};                             /* { sectionId: { day: record } } */
            const isDay = k => /^\d{4}-\d{2}-\d{2}$/.test(k);
            snap.forEach(c => {
                if (isDay(c.key)) {                       /* سجل قديم (قبل المقررات) */
                    items.push(Object.assign({ date: c.key }, c.val() || {}));
                } else {                                  /* سجلات شعبة */
                    bySec[c.key] = c.val() || {};
                    c.forEach(d => { items.push(Object.assign({ date: d.key }, d.val() || {})); });
                }
            });
            showCourses(uid, bySec);
            items.sort((a, b) => b.date.localeCompare(a.date));

            const c = { present: 0, absent: 0, excused: 0 };
            items.forEach(i => c[statusOf(i)]++);
            $("#stats").innerHTML =
                `<div class="stat"><b>${c.present}</b><span>حاضر</span></div>` +
                `<div class="stat"><b>${c.absent}</b><span>غائب</span></div>` +
                `<div class="stat"><b>${c.excused}</b><span>بعذر</span></div>`;

            $("#history").innerHTML = items.length ? items.map(i => {
                const st = statusOf(i);
                return `<li>
                    <div class="hmain"><b>${escapeHtml(i.date)}</b>${i.sec ? `<small>${escapeHtml(i.sec)}</small>` : ""}${i.note ? `<small>${escapeHtml(i.note)}</small>` : ""}</div>
                    <span class="badge ${STATUS[st].cls}">${STATUS[st].icon} ${STATUS[st].label}</span>
                    <span class="tm">${escapeHtml(i.time || "")}</span>
                </li>`;
            }).join("") : `<li class="empty-li">لا يوجد حضور مسجل بعد</li>`;
        }).catch(() => {
            $("#history").innerHTML = `<li class="empty-li">تعذر تحميل السجل</li>`;
        });
    }
</script>
</body>
</html>
