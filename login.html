<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#5b1fa8">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg">
    <title>تسجيل دخول الطالب</title>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar" id="topbar"></header>

<main class="center-page">
    <form class="card center" id="form" novalidate>
        <div class="icon-badge">🎓</div>
        <h2>أهلاً بك</h2>
        <p class="sub">سجّل دخولك للوصول إلى بياناتك ورمز الحضور</p>

        <div class="field">
            <label for="email">البريد الجامعي</label>
            <input type="email" id="email" dir="ltr" placeholder="name@university.edu" autocomplete="username" required>
        </div>

        <div class="field">
            <label for="password">كلمة المرور</label>
            <input type="password" id="password" dir="ltr" placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <button class="btn block lg" id="btn" type="submit">
            <span class="spinner"></span>
            <span>تسجيل الدخول</span>
        </button>

        <p class="msg" id="msg"></p>

        <p class="link-row">ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a></p>
    </form>
</main>

<script src="app.js"></script>
<script>
    renderTopbar([{ key: "teacher", href: "teacher_login.html", text: "دخول المعلم" }], "", { home: "login.html" });

    const form = $("#form"), btn = $("#btn"), msg = $("#msg");

    form.addEventListener("submit", e => {
        e.preventDefault();
        hideMsg(msg);

        const email = $("#email").value.trim();
        const password = $("#password").value;

        if (!email || !password) {
            showMsg(msg, "اكتب البريد وكلمة المرور", "err");
            return;
        }

        setLoading(btn, true);

        auth.signInWithEmailAndPassword(email, password)
            .then(cred => saveStudent(cred.user.uid, email))
            .catch(() => {
                /* نفس سلوك الملف الأصلي: إذا ما فيه حساب ننشئ واحد */
                auth.createUserWithEmailAndPassword(email, password)
                    .then(cred => saveStudent(cred.user.uid, email))
                    .catch(err => {
                        setLoading(btn, false);
                        const text = err.code === "auth/email-already-in-use"
                            ? "كلمة المرور غير صحيحة"
                            : authError(err);
                        showMsg(msg, text, "err");
                    });
            });
    });

    /* لا نكتب فوق بيانات الطالب الموجودة (الاسم الذي أدخله عند التسجيل) */
    function saveStudent(uid, email) {
        const ref = db.ref("students/" + uid);

        ref.once("value").then(snap => {
            if (snap.exists()) return;
            return ref.set({
                name: email.split("@")[0],
                email: email,
                uid: uid,
                created_at: new Date().toISOString()
            });
        }).then(() => {
            window.location.href = "student.html?id=" + uid;
        }).catch(err => {
            setLoading(btn, false);
            showMsg(msg, "خطأ في حفظ البيانات", "err");
            console.log(err);
        });
    }
</script>
</body>
</html>
