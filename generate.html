<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#5b1fa8">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg">
    <title>توليد QR</title>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="locked">

<header class="topbar" id="topbar"></header>

<main class="center-page">
    <section class="card mid center" id="card">
        <div class="loader-dots">جارٍ تحميل البيانات...</div>
    </section>
</main>

<script src="app.js"></script>
<script>
    const card = $("#card");
    const id = getParam("id");

    function notFound(text) {
        card.innerHTML = `
            <div class="icon-badge">🔍</div>
            <h2>${text}</h2>
            <a class="btn" href="teacher.html">العودة للوحة المعلم</a>`;
    }

    requireTeacher().then(() => {
        renderTopbar(TEACHER_LINKS, "students", TEACHER_BAR);

        if (!id) { notFound("لم يتم تحديد الطالب"); return; }

        db.ref("students/" + id).once("value").then(snap => {
            if (!snap.exists()) { notFound("الطالب غير موجود في قاعدة البيانات"); return; }
            const s = snap.val();

            card.innerHTML = `
                <h2>رمز QR للطالب</h2>
                <p class="sub">${escapeHtml(s.name)}</p>
                <div class="qr-box" id="qr"></div>
                <div class="rows" style="text-align:right">
                    <div class="row"><span>اسم الطالب</span><b>${escapeHtml(s.name)}</b></div>
                    <div class="row"><span>البريد</span><b class="ltr">${escapeHtml(s.email)}</b></div>
                </div>
                <div class="no-print" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
                    <button class="btn" id="print" type="button">🖨 طباعة</button>
                    <button class="btn ghost" id="dl" type="button">⬇ تحميل PNG</button>
                </div>`;

            new QRCode($("#qr"), {
                text: s.uid || id,
                width: 240,
                height: 240,
                colorDark: "#2a0a4d",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });

            $("#print").onclick = () => window.print();
            $("#dl").onclick = () => {
                const canvas = $("#qr canvas");
                if (!canvas) return;
                const a = document.createElement("a");
                a.href = canvas.toDataURL("image/png");
                a.download = "qr-" + (s.name || "student") + ".png";
                a.click();
            };
        }).catch(() => notFound("تعذر تحميل البيانات"));
    });
</script>
</body>
</html>
